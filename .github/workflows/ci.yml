name: CI

# Task 8 requires CI on supported Ubuntu and arm64 macOS runners with a
# recorded MoonBit toolchain, Node 22, Python 3.12, and the full local gates.
#
# The official `latest` selector is mutable. Each run records the installer
# digest, installed version strings, and executable hashes so its toolchain is
# identifiable. CI runs on disposable hosted runners only.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Full history: scripts/check-library-consumer.py uses `git archive`
          # of the exact HEAD revision.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install MoonBit toolchain
        run: |
          set -euo pipefail
          curl -fSL --retry 3 --retry-all-errors --connect-timeout 20 \
            https://cli.moonbitlang.com/install/unix.sh \
            -o "$RUNNER_TEMP/moon-install.sh"
          shasum -a 256 "$RUNNER_TEMP/moon-install.sh"
          bash "$RUNNER_TEMP/moon-install.sh" latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Record actual toolchain versions
        run: |
          moon version --all
          node --version
          python --version
          git rev-parse HEAD
          uname -a
          shasum -a 256 "$HOME/.moon/bin/moon" "$HOME/.moon/bin/moonc"

      - name: Install locked host and browser test dependencies
        run: npm ci

      - name: Install the pinned Playwright Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Build and check core
        run: |
          moon check --target js
          moon info
          moon fmt --check

      - name: Core unit tests (MoonBit)
        run: moon test --target js

      - name: Build bridge and run host integration tests
        run: npm test

      - name: Local workbench host tests
        run: npm run test:workbench

      - name: Local workbench browser workflows
        run: npm run test:workbench:e2e

      - name: Build the precompiled Node 22 workbench package
        run: npm run package:workbench

      - name: Relocated package tests
        run: node --test tests/workbench-package.test.mjs

      - name: Synthetic workflow end-to-end chains
        run: npm run test:workflows

      - name: Pinned actual public CSV snapshot workflow (no network)
        run: npm run test:public-data

      - name: Independent assignment oracle
        run: python3 scripts/check-assignment-oracle.py

      - name: Independent MoonBit library consumer
        run: python3 scripts/check-library-consumer.py

      - name: README acceptance smoke from fresh checkout
        run: node scripts/readme-smoke.mjs

      - name: Strict offline package workflow (macOS)
        if: matrix.os == 'macos-15'
        run: npm run test:workbench:package

      - name: Strict offline package workflow (Ubuntu network namespace)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          node_binary="$(command -v node)"
          sudo --preserve-env=PATH unshare --net -- /usr/bin/bash -c '
            set -euo pipefail
            ip link set lo up
            export MOONRECONCILE_NETWORK_ISOLATED=1
            export MOONRECONCILE_NODE_BINARY="$1"
            export PATH="$(dirname "$1"):/usr/bin:/bin:/usr/sbin:/sbin"
            cd "$2"
            exec "$1" scripts/check-workbench-package.mjs
          ' _ "$node_binary" "$GITHUB_WORKSPACE"
