name: CI

# Task 8 requires CI on supported Ubuntu and arm64 macOS runners with a
# recorded MoonBit toolchain, Node 22, Python 3.12, and the full local gates.
#
# The toolchain is PINNED to the version this repository was developed and
# verified against. `latest` was tried first and failed on both runners: a
# newer formatter emits trailing commas (`{ weight: 1, }`) that the pinned
# local formatter does not, so `moon fmt --check` produced a diff and both
# jobs aborted at the first gate. Pinning keeps CI's formatter identical to
# the one that produced the committed sources; the cost is that CI no longer
# detects breakage from newer toolchains, which is a deliberate trade.
#
# The official installer takes the version as its sole positional argument
# (verified against cli.moonbitlang.com/install/unix.sh). The installer digest
# and the printed tool versions are logged on every run for identification.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Recorded toolchain from docs/dependency-audit.md section 1. This is the
  # exact version the committed sources were formatted and tested with.
  MOONBIT_VERSION: "0.1.20260713"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history: scripts/check-library-consumer.py uses `git archive`
          # of the exact HEAD revision.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install MoonBit toolchain
        run: |
          set -euo pipefail
          curl -fSL --retry 3 --retry-all-errors --connect-timeout 20 \
            https://cli.moonbitlang.com/install/unix.sh \
            -o "$RUNNER_TEMP/moon-install.sh"
          shasum -a 256 "$RUNNER_TEMP/moon-install.sh"
          bash "$RUNNER_TEMP/moon-install.sh" "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Record actual toolchain versions
        run: |
          moon version --all
          node --version
          python --version
          git rev-parse HEAD
          uname -a

      - name: Build and check core
        run: |
          moon check --target js
          moon info
          moon fmt --check

      - name: Core unit tests (MoonBit)
        run: moon test --target js

      - name: Build bridge and run host integration tests
        run: npm test

      - name: Synthetic workflow end-to-end chains
        run: npm run test:workflows

      - name: Independent assignment oracle
        run: python3 scripts/check-assignment-oracle.py

      - name: Independent MoonBit library consumer
        run: python3 scripts/check-library-consumer.py
